name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so NuGet's audit sees new advisories even when nothing changes here.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # No telemetry from builds or test runs (docs/licensing/dependency-inventory.md §3).
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs, with the release in a comment. To update one, resolve the
      # new release tag to its commit (gh api repos/<owner>/<action>/commits/<tag> --jq .sha).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Fetch qpdf (pinned release, SHA-256 verified)
        shell: pwsh
        run: ./tools/qpdf/fetch-qpdf.ps1

      - name: Restore (locked)
        run: dotnet restore PdfSuite.slnx --locked-mode

      - name: Build
        run: dotnet build PdfSuite.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution PdfSuite.slnx -c Release --no-build

      - name: Generate fixtures
        run: dotnet run --project tools/PdfSuite.FixtureGenerator -c Release --no-build

      - name: Worker self-test in a separate process
        run: dotnet run --project src/PdfSuite.Pdf.Worker -c Release --no-build -- --self-test fixtures/generated/large-2000-pages.pdf

      - name: Record fixture hashes
        shell: pwsh
        run: |
          $lines = Get-ChildItem fixtures/generated | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText("fixture-hashes.txt", ($lines -join "`n") + "`n")
          # Annotations are readable without signing in to GitHub; logs and artifacts are not.
          foreach ($line in $lines) { "::notice title=Fixture hash (${{ runner.os }})::$line" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-hashes-${{ runner.os }}
          path: fixture-hashes.txt

  # Spike S0 finding check: is PDFium's output identical on every OS? A difference is a
  # finding to record in docs/research/spike-results.md, not a build failure.
  fixtures-identical-across-os:
    name: Fixtures identical across OSes (informational)
    needs: build-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixture-hashes-*
          path: hashes

      - name: Compare
        run: |
          status=0
          for os in Windows macOS; do
            while read -r file; do
              echo "::warning title=Fixture differs (Linux vs $os)::$file"
              status=1
            done < <(join -j 2 -o 0,1.1,2.1 \
                       <(sort -k2 hashes/fixture-hashes-Linux/fixture-hashes.txt) \
                       <(sort -k2 "hashes/fixture-hashes-$os/fixture-hashes.txt") | awk '$2 != $3 { print $1 }')
          done
          exit $status
