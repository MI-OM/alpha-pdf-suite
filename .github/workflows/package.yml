# Spike item S6 (docs/06-SPIKE-PLAN.md): build installable packages on each OS, then install each
# one on a fresh runner and launch it with --smoke-test. Packages are NativeAOT. A self-contained
# ReadyToRun build is published alongside, only to compare size and startup.
name: Package (spike)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
  # Weekly. Only publishes restore the runtime and NativeAOT packages, so this is where their
  # advisories surface: CVE-2026-111497 was found only by a publish (spike results, finding 50).
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: Package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs, with the release in a comment. To update one, resolve the
      # new release tag to its commit (gh api repos/<owner>/<action>/commits/<tag> --jq .sha).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: NativeAOT and display prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev xvfb xauth

      - name: Fetch qpdf (pinned release, SHA-256 verified)
        shell: pwsh
        run: ./tools/qpdf/fetch-qpdf.ps1 -Rid ${{ matrix.rid }}

      - name: Restore (locked)
        run: dotnet restore PdfSuite.slnx --locked-mode

      - name: Generate fixtures
        run: dotnet run --project tools/PdfSuite.FixtureGenerator -c Release

      - name: Publish (NativeAOT)
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./tools/package/publish.ps1 -Rid ${{ matrix.rid }} -Mode aot

      # A Linux program needs the glibc it was linked against, or newer. Linked on this runner
      # (glibc 2.43), the app needed glibc 2.38, for fmod alone (spike results, finding 53). So the
      # NativeAOT build runs in a container of the oldest release the .deb accepts: Ubuntu 22.04,
      # glibc 2.35, pinned by digest. This runner's SDK and PowerShell are mounted at their own
      # paths, and the build runs as this runner's user, so everything it writes stays usable here.
      # GITHUB_ACTIONS is passed so that the publish script's notices become annotations.
      # To update the image: the "digest" of https://hub.docker.com/v2/repositories/library/ubuntu/tags/22.04
      - name: Publish (NativeAOT, linked against Ubuntu 22.04's glibc)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build --quiet --tag pdf-suite-linux-build - <<'EOF'
          FROM ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          RUN apt-get update \
           && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang zlib1g-dev ca-certificates libicu70 \
           && rm -rf /var/lib/apt/lists/*
          EOF
          echo "::notice title=Linux build::Linked against $(docker run --rm pdf-suite-linux-build sh -c 'ldd --version | head -n 1')"
          dotnet_root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          pwsh_root=$(dirname "$(readlink -f "$(command -v pwsh)")")
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$HOME:$HOME" --volume "$dotnet_root:$dotnet_root" --volume "$pwsh_root:$pwsh_root:ro" \
            --env HOME --env DOTNET_ROOT="$dotnet_root" --env PATH="$dotnet_root:$pwsh_root:/usr/local/bin:/usr/bin:/bin" \
            --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env GITHUB_ACTIONS \
            --workdir "$PWD" pdf-suite-linux-build \
            pwsh -NoProfile -File tools/package/publish.ps1 -Rid ${{ matrix.rid }} -Mode aot

      - name: Publish (self-contained ReadyToRun, for comparison)
        shell: pwsh
        run: ./tools/package/publish.ps1 -Rid ${{ matrix.rid }} -Mode r2r

      - name: Linked libraries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for file in artifacts/package/${{ matrix.rid }}-aot/app/*; do
            echo "== $file"
            if [ "$RUNNER_OS" = macOS ]; then otool -L "$file" || true; else ldd "$file" || true; fi
          done

      - name: Smoke test the published folders (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          foreach ($mode in 'r2r', 'aot') {
            ./tools/package/smoke-test.ps1 -Label "${{ matrix.rid }} $mode folder" -Command "artifacts/package/${{ matrix.rid }}-$mode/app/PdfSuite.App.exe" -Fixture fixtures/generated/large-2000-pages.pdf
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed

      - name: Smoke test the published folders (macOS, Linux)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          status=0
          for mode in r2r aot; do
            sh tools/package/smoke-test.sh "${{ matrix.rid }} $mode folder" fixtures/generated/large-2000-pages.pdf 3 "artifacts/package/${{ matrix.rid }}-$mode/app/PdfSuite.App" || status=1
          done
          exit $status

      - name: Package (MSIX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package/package-windows.ps1 -Layout artifacts/package/win-x64-aot/app -Output artifacts/package/out/pdf-suite-win-x64.msix

      - name: Package (DMG)
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./tools/package/package-macos.ps1 -Layout artifacts/package/osx-arm64-aot/app -Output artifacts/package/out/pdf-suite-osx-arm64.dmg

      - name: Package (AppImage and .deb)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tools/package/package-linux.ps1 -Layout artifacts/package/linux-x64-aot/app -OutputDirectory artifacts/package/out

      # The install jobs run on fresh runners without the SDK build, so they get the fixture here.
      - name: Add the fixture
        shell: bash
        run: cp fixtures/generated/large-2000-pages.pdf artifacts/package/out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/package/out

  install-msix:
    name: Install and launch (MSIX, Windows)
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-win-x64
          path: packages

      # A throwaway runner. Trusting a test certificate on a real machine is its owner's decision.
      - name: Trust the test certificate and install
        shell: pwsh
        run: |
          certutil -addstore TrustedPeople packages/pdf-suite-win-x64.cer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-AppxPackage -Path packages/pdf-suite-win-x64.msix
          $package = Get-AppxPackage PdfSuite.Spike
          $package | Format-List Name, Version, Architecture, SignatureKind, Status, InstallLocation
          $bytes = (Get-ChildItem $package.InstallLocation -Recurse -File | Measure-Object Length -Sum).Sum
          "::notice title=MSIX installed::{0:N1} MB on disk" -f ($bytes / 1MB)

      - name: Launch the installed app
        shell: pwsh
        run: ./tools/package/smoke-test.ps1 -Label 'MSIX installed' -Command "$env:LOCALAPPDATA\Microsoft\WindowsApps\pdf-suite.exe" -Fixture packages/large-2000-pages.pdf

      - name: Uninstall
        shell: pwsh
        run: |
          Get-AppxPackage PdfSuite.Spike | Remove-AppxPackage
          if (Get-AppxPackage PdfSuite.Spike) { throw 'The package is still installed.' }
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\pdf-suite.exe") { throw 'The execution alias is still there.' }

  install-dmg:
    name: Install and launch (DMG, macOS)
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-osx-arm64
          path: packages

      - name: Install from the DMG
        run: |
          hdiutil attach packages/pdf-suite-osx-arm64.dmg -nobrowse -mountpoint /tmp/pdf-suite-dmg
          cp -R "/tmp/pdf-suite-dmg/PDF Suite.app" /Applications/
          hdiutil detach /tmp/pdf-suite-dmg
          codesign --verify --deep --strict --verbose=2 "/Applications/PDF Suite.app"
          codesign --display --verbose=2 "/Applications/PDF Suite.app" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Signature|TeamIdentifier|Runtime)'
          echo "::notice title=DMG installed::$(du -sh "/Applications/PDF Suite.app" | cut -f1) on disk"

      # A browser download is quarantined, and Gatekeeper then assesses the app like this.
      - name: Gatekeeper assessment (informational)
        run: |
          if result=$(spctl --assess --type execute --verbose=4 "/Applications/PDF Suite.app" 2>&1); then
            echo "::notice title=Gatekeeper::accepted: $result"
          else
            echo "::notice title=Gatekeeper::rejected: $result"
          fi

      - name: Launch the installed app
        run: sh tools/package/smoke-test.sh "DMG installed" packages/large-2000-pages.pdf 3 "/Applications/PDF Suite.app/Contents/MacOS/PdfSuite.App"

  # A bare image of every release whose ICU the package accepts (package-linux.ps1): apt must
  # install everything the package declares, and the app must start on that release's glibc and
  # libstdc++ (spike results, finding 53). xvfb, needed to give the app a display, brings X
  # libraries of its own, so this cannot prove that no X library is missing.
  install-deb:
    name: Install and launch (.deb, clean ${{ matrix.image }} container)
    needs: package
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # Older images pull in tzdata with xvfb, and its question would wait for an answer.
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-linux-x64
          path: packages

      - name: Install with apt
        run: |
          apt-get update
          log="$RUNNER_TEMP/apt.txt"
          if ! apt-get install -y --no-install-recommends ./packages/pdf-suite-linux-x64.deb > "$log" 2>&1; then
            cat "$log"
            echo "::error title=.deb on ${{ matrix.image }}::apt refused the package: $( (grep -m1 'Depends:' "$log" || tail -n 1 "$log") | sed 's/^ *//')"
            exit 1
          fi
          cat "$log"
          dpkg -s pdf-suite-spike | grep -E '^(Version|Installed-Size|Depends):'
          versions() { dpkg-query -W -f='${Package} ${Version} ${db:Status-Status}\n' "$@" | awk '$3 == "installed" { printf "%s %s; ", $1, $2 }'; }
          echo "::notice title=.deb on ${{ matrix.image }}::installed, $(du -sh /opt/pdf-suite | cut -f1) on disk. $(versions libc6 libstdc++6 'libicu[0-9]*')"
          apt-get install -y --no-install-recommends xvfb xauth

      - name: Launch the installed app
        run: sh tools/package/smoke-test.sh ".deb on ${{ matrix.image }}" packages/large-2000-pages.pdf 3 pdf-suite

      # PRD §9: reading makes no network request. The app runs under strace and must open no IPv4
      # or IPv6 socket; local sockets (X11, D-Bus) are fine. The control shows the trace would
      # catch one: bash connecting to a closed local port opens an IPv4 socket. One release is
      # enough: what is checked is the app, not the system.
      - name: No network use while reading
        if: matrix.image == 'ubuntu:24.04'
        run: |
          apt-get install -y --no-install-recommends strace
          trace="$RUNNER_TEMP/network.txt"
          sh tools/package/smoke-test.sh ".deb under strace" packages/large-2000-pages.pdf 1 strace -f -qq -e trace=socket,connect -o "$trace" pdf-suite
          echo "Socket families: $(grep -o 'socket(AF_[A-Z0-9]*' "$trace" | sort | uniq -c | tr -s ' \n' ' ')"
          if grep 'AF_INET' "$trace"; then
            echo "::error title=Network::The app opened an IP socket while reading."
            exit 1
          fi
          control="$RUNNER_TEMP/control.txt"
          strace -f -qq -e trace=socket,connect -o "$control" bash -c 'exec 3<>/dev/tcp/127.0.0.1/9' || true
          grep -q 'socket(AF_INET,' "$control" || { echo "::error title=Network::The control was not traced, so the check proves nothing."; exit 1; }
          echo "::notice title=Network::No IP socket while opening and rendering; $(grep -c . "$trace") socket and connect calls traced, and the control was caught"

      - name: Remove
        run: |
          apt-get remove -y pdf-suite-spike
          test ! -e /opt/pdf-suite/PdfSuite.App
          test ! -e /usr/bin/pdf-suite

  install-appimage:
    name: Launch (AppImage, Ubuntu)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-linux-x64
          path: packages

      - name: Display prerequisites
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth; }

      # Artifacts do not keep file modes. An AppImage mounts itself with FUSE; if the runner cannot,
      # the run is repeated with the runtime's extract-and-run mode, and each outcome is recorded.
      - name: Launch the AppImage
        run: |
          chmod +x packages/pdf-suite-linux-x64.AppImage
          echo "fusermount: $(command -v fusermount3 || command -v fusermount || echo none); /dev/fuse: $(ls -l /dev/fuse 2>&1)"
          if ! sh tools/package/smoke-test.sh "AppImage (FUSE)" packages/large-2000-pages.pdf 3 "$PWD/packages/pdf-suite-linux-x64.AppImage"; then
            echo "::warning title=AppImage::Running with FUSE failed; trying APPIMAGE_EXTRACT_AND_RUN=1"
            APPIMAGE_EXTRACT_AND_RUN=1 sh tools/package/smoke-test.sh "AppImage (extract and run)" packages/large-2000-pages.pdf 3 "$PWD/packages/pdf-suite-linux-x64.AppImage"
          fi
