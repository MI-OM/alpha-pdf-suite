# Spike item S6 scaffold: self-contained publishes of the app and worker for one runtime per OS.
# Installers (MSIX, notarised DMG, AppImage/.deb) and NativeAOT are added on spike Day 10.
name: Package (spike)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Not --locked-mode: the lock files do not yet cover runtime-specific packs. RID restores
      # write their lock file under obj/ (Directory.Build.props). Day 10 decides whether to
      # declare RuntimeIdentifiers so publishes can restore in locked mode too.
      - name: Publish worker
        run: dotnet publish src/PdfSuite.Pdf.Worker -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      - name: Publish app
        run: dotnet publish src/PdfSuite.App -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      - name: Size report
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem publish/${{ matrix.rid }} -Recurse -File | Measure-Object Length -Sum).Sum
          "{0}: {1:N1} MB in {2} files" -f "${{ matrix.rid }}", ($bytes / 1MB), (Get-ChildItem publish/${{ matrix.rid }} -Recurse -File).Count

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-suite-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
